[package]
name = "economat-boulangerie-pro"
version = "1.0.0"
description = "Économat BOULANGERIE PRO"
authors = ["Emmanuel Pradie"]
edition = "2021"

[lib]
name = "economat_boulangerie_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
